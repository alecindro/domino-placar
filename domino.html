<!DOCTYPE html>
<html lang="pt-BR">
<body style="font-family: sans-serif; text-align: center; padding: 40px;">
  <h2>Gerador de Ícone Dominó Doble 6 (512x512)</h2>
  <canvas id="canvas" width="512" height="512" style="border: 1px solid #ccc; border-radius: 24px;"></canvas>
  <br><br>
  <button onclick="baixar()" style="padding: 14px 28px; font-size: 16px; background: #15803d; color: #fff; border: none; border-radius: 8px; cursor: pointer;">
    ⬇️ Baixar icon-domino.png
  </button>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // 1. Fundo verde arredondado
    ctx.fillStyle = '#15803d';
    ctx.beginPath();
    ctx.roundRect(0, 0, 512, 512, 112);
    ctx.fill();

    // 2. Sombra da pedra
    ctx.fillStyle = 'rgba(15, 81, 50, 0.5)';
    ctx.beginPath();
    ctx.roundRect(148, 64, 224, 392, 28);
    ctx.fill();

    // 3. Corpo branco da pedra
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.roundRect(144, 56, 224, 392, 28);
    ctx.fill();

    // 4. Linha divisória central
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 10;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(168, 252);
    ctx.lineTo(344, 252);
    ctx.stroke();

    // 5. Desenhar os 12 pinos (Doble 6)
    ctx.fillStyle = '#0f172a';
    const colunas = [198, 314];
    const linhas =  [102, 154, 206, 298, 350, 402];

    for (const x of colunas) {
      for (const y of linhas) {
        ctx.beginPath();
        ctx.arc(x, y, 18, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function baixar() {
      const link = document.createElement('a');
      link.download = 'icon-domino.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
